name: fortadocs

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${FORTADOCS_BACKEND_IMAGE:-fortadocs-backend:latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ${FORTADOCS_ENV_FILE:-.env.production}
        required: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_REVISION: ${APP_REVISION:-manual}
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL em .env.production}
      DIRECT_URL: ${DIRECT_URL:?Configure DIRECT_URL em .env.production}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET em .env.production}
      BITRIX_TOKEN_ENCRYPTION_KEY: ${BITRIX_TOKEN_ENCRYPTION_KEY:?Configure BITRIX_TOKEN_ENCRYPTION_KEY em .env.production}
      BITRIX_CLIENT_ID: ${BITRIX_CLIENT_ID:?Configure BITRIX_CLIENT_ID em .env.production}
      BITRIX_CLIENT_SECRET: ${BITRIX_CLIENT_SECRET:?Configure BITRIX_CLIENT_SECRET em .env.production}
      BITRIX_PORTAL_ORIGIN: ${BITRIX_PORTAL_ORIGIN:?Configure BITRIX_PORTAL_ORIGIN em .env.production}
      BITRIX_TERM_OPERATOR_USER_IDS: ${BITRIX_TERM_OPERATOR_USER_IDS:-}
      BITRIX_TERM_NOTIFICATION_USER_IDS: ${BITRIX_TERM_NOTIFICATION_USER_IDS:-}
      BITRIX_SIGN_COMPANY_CRM_ID: ${BITRIX_SIGN_COMPANY_CRM_ID:-67539}
      BITRIX_DRIVE_OWNER_USER_ID: ${BITRIX_DRIVE_OWNER_USER_ID:?Configure BITRIX_DRIVE_OWNER_USER_ID em .env.production}
      BITRIX_DRIVE_FOLDER_NAME: ${BITRIX_DRIVE_FOLDER_NAME:-Termo de Responsabilidade}
      PUBLIC_BACKEND_URL: https://${FORTADOCS_DOMAIN:?Configure FORTADOCS_DOMAIN em .env.production}/api
      FRONTEND_URL: https://${FORTADOCS_DOMAIN}
      CORS_ORIGINS: https://${FORTADOCS_DOMAIN}
      SUPABASE_URL: ${SUPABASE_URL:?Configure SUPABASE_URL em .env.production}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Configure SUPABASE_SECRET_KEY em .env.production}
      STORAGE_DRIVER: supabase
      RESPONSIBILITY_TEMPLATE_PATH: /templates/term.docx
      LIBREOFFICE_BIN: libreoffice
      PDF_CONVERSION_CONCURRENCY: ${PDF_CONVERSION_CONCURRENCY:-1}
      PDF_CONVERSION_QUEUE_LIMIT: ${PDF_CONVERSION_QUEUE_LIMIT:-20}
      PDF_CONVERSION_QUEUE_TIMEOUT_MS: ${PDF_CONVERSION_QUEUE_TIMEOUT_MS:-30000}
      LOCAL_DEVELOPMENT_MODE: "false"
      ENABLE_API_DOCS: "false"
    expose:
      - "3000"
    networks:
      - proxy
    restart: unless-stopped
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-fortatech-proxy}
      - traefik.http.routers.fortadocs-api.rule=Host(`${FORTADOCS_DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.fortadocs-api.entrypoints=websecure
      - traefik.http.routers.fortadocs-api.priority=100
      - traefik.http.routers.fortadocs-api.service=fortadocs-api
      - traefik.http.routers.fortadocs-api.tls=true
      - traefik.http.routers.fortadocs-api.tls.certresolver=letsencrypt
      - traefik.http.routers.fortadocs-api.middlewares=fortadocs-strip-api@docker,secure-headers@file,compression@file
      - traefik.http.middlewares.fortadocs-strip-api.stripprefix.prefixes=/api
      - traefik.http.services.fortadocs-api.loadbalancer.server.port=3000
      - traefik.http.services.fortadocs-api.loadbalancer.healthcheck.path=/health/ready
      - traefik.http.services.fortadocs-api.loadbalancer.healthcheck.interval=30s
      - traefik.http.services.fortadocs-api.loadbalancer.healthcheck.timeout=5s

  frontend:
    image: ${FORTADOCS_FRONTEND_IMAGE:-fortadocs-frontend:latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://${FORTADOCS_DOMAIN:?Configure FORTADOCS_DOMAIN em .env.production}/api
        VITE_LOCAL_DEVELOPMENT_MODE: "false"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - proxy
    restart: unless-stopped
    stop_grace_period: 15s
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-fortatech-proxy}
      - traefik.http.routers.fortadocs-web.rule=Host(`${FORTADOCS_DOMAIN}`)
      - traefik.http.routers.fortadocs-web.entrypoints=websecure
      - traefik.http.routers.fortadocs-web.priority=10
      - traefik.http.routers.fortadocs-web.service=fortadocs-web
      - traefik.http.routers.fortadocs-web.tls=true
      - traefik.http.routers.fortadocs-web.tls.certresolver=letsencrypt
      - traefik.http.routers.fortadocs-web.middlewares=secure-headers@file,compression@file
      - traefik.http.services.fortadocs-web.loadbalancer.server.port=80
      - traefik.http.services.fortadocs-web.loadbalancer.healthcheck.path=/health
      - traefik.http.services.fortadocs-web.loadbalancer.healthcheck.interval=30s
      - traefik.http.services.fortadocs-web.loadbalancer.healthcheck.timeout=5s
      - traefik.http.routers.fortadocs-http.rule=Host(`${FORTADOCS_DOMAIN}`)
      - traefik.http.routers.fortadocs-http.entrypoints=web
      - traefik.http.routers.fortadocs-http.service=fortadocs-web
      - traefik.http.routers.fortadocs-http.middlewares=redirect-to-https@file

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-fortatech-proxy}
