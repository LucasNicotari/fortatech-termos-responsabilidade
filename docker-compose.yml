x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    pids_limit: 200
    logging: *default-logging
    environment:
      POSTGRES_DB: fortatech_termos
      POSTGRES_USER: fortatech
      POSTGRES_PASSWORD: fortatech
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortatech -d fortatech_termos"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    pids_limit: 256
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://fortatech:fortatech@postgres:5432/fortatech_termos?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://fortatech:fortatech@postgres:5432/fortatech_termos?schema=public}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-before-production}
      BITRIX_TOKEN_ENCRYPTION_KEY: ${BITRIX_TOKEN_ENCRYPTION_KEY:-dev-only-change-this-encryption-key}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-supabase}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/app/storage-data}
      LOCAL_STORAGE_SIGNING_KEY: ${LOCAL_STORAGE_SIGNING_KEY:-}
      RESPONSIBILITY_TEMPLATE_PATH: /templates/term.docx
      LIBREOFFICE_BIN: libreoffice
      PDF_CONVERSION_CONCURRENCY: ${PDF_CONVERSION_CONCURRENCY:-1}
      PDF_CONVERSION_QUEUE_LIMIT: ${PDF_CONVERSION_QUEUE_LIMIT:-20}
      PDF_CONVERSION_QUEUE_TIMEOUT_MS: ${PDF_CONVERSION_QUEUE_TIMEOUT_MS:-30000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      LOCAL_DEVELOPMENT_MODE: ${LOCAL_DEVELOPMENT_MODE:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: ${RESPONSIBILITY_TEMPLATE_HOST_PATH:-./templates/term.docx}
        target: /templates/term.docx
        read_only: true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_LOCAL_DEVELOPMENT_MODE: ${VITE_LOCAL_DEVELOPMENT_MODE:-false}
    restart: unless-stopped
    pids_limit: 100
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  postgres_data:
  local_storage_data:
