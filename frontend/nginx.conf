server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http://localhost:3000 http://127.0.0.1:3000; img-src 'self' data: https://fortaeqt.bitrix24.com.br; frame-src 'self' https: http://localhost:3000 http://127.0.0.1:3000; style-src 'self' 'unsafe-inline'; script-src 'self' https://api.bitrix24.com; frame-ancestors https://fortaeqt.bitrix24.com.br; base-uri 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
