services:
  postgres-roles:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      PGPASSWORD: fortatech
    command:
      - psql
      - -h
      - postgres
      - -U
      - fortatech
      - -d
      - fortatech_termos
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /local-supabase-roles.sql
    volumes:
      - ./backend/prisma/local-supabase-roles.sql:/local-supabase-roles.sql:ro

  backend:
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://fortatech:fortatech@postgres:5432/fortatech_termos?schema=public
      DIRECT_URL: postgresql://fortatech:fortatech@postgres:5432/fortatech_termos?schema=public
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/storage-data
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:3000}
      LOCAL_DEVELOPMENT_MODE: "true"
    volumes:
      - local_storage_data:/app/storage-data
  frontend:
    build:
      args:
        VITE_LOCAL_DEVELOPMENT_MODE: "true"

volumes:
  local_storage_data:
